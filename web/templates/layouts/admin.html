{{define "admin"}}
<!doctype html>
<html lang="en" data-admin-shell data-sidebar-collapsed="false">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{if .Title}}{{.Title}} · {{end}}{{.AppName}}</title>
    <style>html[data-sidebar-disclosure-pending="true"] #admin-sidebar nav { visibility: hidden; }</style>
    {{template "head-state-init" .}}
    <link rel="stylesheet" href="/static/css/app.css">
    <script defer src="/static/js/app.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100" x-data="adminShell" @keydown.escape.window="closeMobile()">
    <div x-cloak x-show="mobileOpen" x-transition.opacity class="fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm lg:hidden" @click="closeMobile()" aria-hidden="true"></div>
    {{template "sidebar" .}}
    <div class="admin-main min-h-screen transition-[padding] duration-200">
        {{template "topbar" .}}
        <main class="mx-auto max-w-7xl p-4 sm:p-6 lg:p-8">
            <div class="pointer-events-none fixed right-4 top-20 z-50 w-[calc(100%-2rem)] max-w-sm">{{template "toast" .}}</div>
            {{template "content" .}}
        </main>
    </div>
    {{template "confirmation-dialog" .}}
</body>
</html>
{{end}}
