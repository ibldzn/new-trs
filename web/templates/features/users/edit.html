{{/* Users feature */}}{{define "content"}}
<section class="max-w-2xl">
    <a href="/users" class="text-sm font-medium text-emerald-700 hover:underline dark:text-emerald-400">← Users</a>
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-950 dark:text-white">Edit User</h1>
    <form method="post" action="{{.Data.Action}}" class="mt-6 space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        {{with index .Data.Errors "form"}}<p role="alert" class="rounded-lg bg-red-50 p-3 text-sm text-red-700 dark:bg-red-950/40 dark:text-red-300">{{.}}</p>{{end}}
        <div><label for="name" class="block text-sm font-medium">Name</label><input id="name" name="name" value="{{.Data.Name}}" required autocomplete="name" aria-describedby="name-error" class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-950"><p id="name-error" class="mt-1 text-sm text-red-600 dark:text-red-400">{{index .Data.Errors "name"}}</p></div>
        <div><label for="username" class="block text-sm font-medium">Username</label><input id="username" name="username" value="{{.Data.Username}}" required autocomplete="username" aria-describedby="username-error" class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-950"><p id="username-error" class="mt-1 text-sm text-red-600 dark:text-red-400">{{index .Data.Errors "username"}}</p></div>
        <div class="flex gap-3"><button class="rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-emerald-400">Save Changes</button><a href="/users" class="rounded-lg px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Cancel</a></div>
    </form>
</section>
{{end}}
