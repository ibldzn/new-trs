{{/* Users feature */}}{{define "content"}}
<section class="max-w-2xl">
    <a href="/users/{{.Data.User.ID}}" class="text-sm font-medium text-emerald-700 hover:underline dark:text-emerald-400">← {{.Data.User.Name}}</a>
    <h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-950 dark:text-white">Reset Password</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-400">All sessions for @{{.Data.User.Username}} will be revoked.</p>
    <form method="post" action="/users/{{.Data.User.ID}}/reset-password" class="mt-6 space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <div><label for="password" class="block text-sm font-medium">New Password</label><input id="password" name="password" type="password" required autocomplete="new-password" aria-describedby="password-error" class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-950"><p id="password-error" class="mt-1 text-sm text-red-600 dark:text-red-400">{{index .Data.Errors "password"}}</p></div>
        <div><label for="password-confirmation" class="block text-sm font-medium">Confirm Password</label><input id="password-confirmation" name="password_confirmation" type="password" required autocomplete="new-password" aria-describedby="password-confirmation-error" class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-950"><p id="password-confirmation-error" class="mt-1 text-sm text-red-600 dark:text-red-400">{{index .Data.Errors "password_confirmation"}}</p></div>
        <button class="rounded-lg bg-red-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-500">Reset Password</button>
    </form>
</section>
{{end}}
