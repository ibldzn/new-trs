{{define "content"}}
<section>
    <div class="mb-6"><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Management</p><h1 class="page-title mt-1">Access Management</h1><p class="mt-2 text-slate-600 dark:text-slate-400">Manage local THOR access for Fincloud identities.</p></div>
    <form method="get" action="/access" class="mb-4" hx-get="/access" hx-target="#users-table" hx-swap="outerHTML" hx-push-url="true" hx-trigger="input changed delay:300ms, search"><label for="user-search" class="sr-only">Search users</label><input id="user-search" name="q" type="search" value="{{.Data.Query}}" placeholder="Search name or username" autocomplete="off" class="input w-full max-w-md text-sm"></form>
    {{template "users-table" .}}
</section>
{{end}}
