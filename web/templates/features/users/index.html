{{define "content"}}
<section>
    <div class="mb-6"><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Management</p><h1 class="mt-1 text-3xl font-bold tracking-tight text-slate-950 dark:text-white">Access Management</h1><p class="mt-2 text-slate-600 dark:text-slate-400">Manage local THOR access for Fincloud identities.</p></div>
    <form method="get" action="/access" class="mb-4" hx-get="/access" hx-target="#users-table" hx-swap="outerHTML" hx-push-url="true" hx-trigger="input changed delay:300ms, search"><label for="user-search" class="sr-only">Search users</label><input id="user-search" name="q" type="search" value="{{.Data.Query}}" placeholder="Search name or username" autocomplete="off" class="w-full max-w-md rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-950 shadow-sm focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 dark:border-slate-700 dark:bg-slate-900 dark:text-white"></form>
    {{template "users-table" .}}
</section>
{{end}}
