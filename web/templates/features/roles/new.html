{{/* Roles feature */}}{{define "content"}}
<section class="max-w-2xl"><a href="/roles" class="text-sm font-medium text-emerald-700 hover:underline dark:text-emerald-400">← Roles</a><h1 class="mt-4 text-3xl font-bold tracking-tight text-slate-950 dark:text-white">New Role</h1><form method="post" action="/roles" class="mt-6 space-y-5 rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900"><div><label for="name" class="block text-sm font-medium">Name</label><input id="name" name="name" value="{{.Data.Name}}" required aria-describedby="name-error" class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-950"><p id="name-error" class="mt-1 text-sm text-red-600">{{index .Data.Errors "name"}}</p></div><div><label for="slug" class="block text-sm font-medium">Slug</label><input id="slug" name="slug" value="{{.Data.Slug}}" required pattern="[a-z0-9]+([-_][a-z0-9]+)*" aria-describedby="slug-error" class="mt-2 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 font-mono dark:border-slate-700 dark:bg-slate-950"><p class="mt-1 text-xs text-slate-500">Lowercase letters, numbers, hyphens, or underscores. Immutable after creation.</p><p id="slug-error" class="mt-1 text-sm text-red-600">{{index .Data.Errors "slug"}}</p></div><div class="flex gap-3"><button class="rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-950 hover:bg-emerald-400">Create Role</button><a href="/roles" class="rounded-lg px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Cancel</a></div></form></section>
{{end}}
