{{/* LPS generation feature */}}{{define "content"}}
<section class="space-y-6">
    <div><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Reporting</p><h1 class="page-title mt-1">LPS generation</h1><p class="mt-2 text-slate-600 dark:text-slate-400">Generates DN, DSN, DK, and DSJ in one ZIP.</p></div>
    {{if .Data.Error}}<div role="alert" class="alert-error">{{.Data.Error}}</div>{{end}}
    <form method="post" action="/lps" class="card grid gap-4 p-5 sm:grid-cols-2">
        <label class="text-sm font-medium">Kode kepesertaan<input name="participant_code" value="{{.Data.Input.ParticipantCode}}" required pattern="[0-9]{8}" class="input mt-1 w-full"></label>
        <label class="text-sm font-medium">Tanggal pelaporan<input type="date" name="reporting_date" value="{{.Data.DateInputValue}}" required class="input mt-1 w-full"></label>
        <label class="text-sm font-medium">Periode pengiriman<select name="period" required class="input mt-1 w-full">
            <option value="">Pilih periode</option>
            <option value="D" {{if eq .Data.Input.Period "D"}}selected{{end}}>D = Daily</option>
            <option value="M" {{if eq .Data.Input.Period "M"}}selected{{end}}>M = Monthly</option>
            <option value="S" {{if eq .Data.Input.Period "S"}}selected{{end}}>S = Semester</option>
        </select></label>
        <label class="text-sm font-medium">Versi laporan<select name="version" required class="input mt-1 w-full">
            <option value="">Pilih versi</option>
            <option value="R" {{if eq .Data.Input.Version "R"}}selected{{end}}>R = Reguler</option>
            <option value="K1" {{if eq .Data.Input.Version "K1"}}selected{{end}}>K1 = Koreksi 1</option>
            <option value="K2" {{if eq .Data.Input.Version "K2"}}selected{{end}}>K2 = Koreksi 2</option>
            <option value="K3" {{if eq .Data.Input.Version "K3"}}selected{{end}}>K3 = Koreksi 3</option>
        </select></label>
        <button class="btn btn-primary sm:col-span-2">Generate ZIP</button>
    </form>
</section>
{{end}}
