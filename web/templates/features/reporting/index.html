{{/* Reporting feature */}}{{define "content"}}
<section class="space-y-6">
    <div><p class="text-sm font-medium text-emerald-600 dark:text-emerald-400">Reporting</p><h1 class="mt-1 text-3xl font-bold">Bulk contractual report</h1><p class="mt-2 text-slate-600 dark:text-slate-400">Upload CSV with account numbers in first column.</p></div>
    {{if .Data.Error}}<div role="alert" class="rounded-xl border border-red-300 bg-red-50 p-4 text-red-800 dark:border-red-900 dark:bg-red-950 dark:text-red-200">{{.Data.Error}}</div>{{end}}
    <form method="post" action="/reports" enctype="multipart/form-data" class="grid gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:grid-cols-[12rem_1fr_auto] sm:items-end dark:border-slate-800 dark:bg-slate-900">
        <label class="block text-sm font-medium">Reporting date<input type="date" name="as_of" value="{{.Data.AsOf}}" required class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 dark:border-slate-700 dark:bg-slate-950"></label>
        <label class="block text-sm font-medium">Account CSV<input type="file" name="accounts" accept=".csv,text/csv" required class="mt-1 block w-full text-sm"></label>
        <button class="rounded-lg bg-emerald-500 px-4 py-2.5 font-semibold text-slate-950 hover:bg-emerald-400">Generate</button>
    </form>
</section>
{{end}}
