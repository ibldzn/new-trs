{{define "confirmation-dialog"}}
<dialog x-data="confirmationDialog" x-ref="dialog" @confirm-submit.window="open($event)" @cancel.prevent="cancel()" @close="restoreFocus()" aria-labelledby="confirmation-title" aria-describedby="confirmation-message" class="w-[calc(100%-2rem)] max-w-md rounded-2xl border border-slate-200 bg-white p-0 text-slate-900 shadow-2xl backdrop:bg-slate-950/70 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100">
    <form method="dialog" class="p-6">
        <h2 id="confirmation-title" class="text-xl font-bold" x-text="title"></h2>
        <p id="confirmation-message" class="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-300" x-text="message"></p>
        <div class="mt-6 flex justify-end gap-3">
            <button x-ref="cancel" type="button" @click="cancel()" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-400 dark:border-slate-700 dark:hover:bg-slate-800">Cancel</button>
            <button type="button" @click="confirm()" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900" x-text="confirmLabel"></button>
        </div>
    </form>
</dialog>
{{end}}
