{{define "confirmation-dialog"}}
<dialog x-data="confirmationDialog" x-ref="dialog" @confirm-submit.window="open($event)" @cancel.prevent="cancel()" @close="restoreFocus()" aria-labelledby="confirmation-title" aria-describedby="confirmation-message" class="m-auto max-h-[calc(100dvh-2rem)] w-[calc(100%-2rem)] max-w-md overflow-y-auto rounded-2xl border border-slate-200 bg-white p-0 text-slate-900 shadow-2xl backdrop:bg-slate-950/70 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100">
    <form method="dialog" class="p-6">
        <h2 id="confirmation-title" class="text-xl font-bold" x-text="title"></h2>
        <p id="confirmation-message" class="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-300" x-text="message"></p>
        <div class="mt-6 flex justify-end gap-3">
            <button x-ref="cancel" type="button" @click="cancel()" class="btn btn-secondary">Cancel</button>
            <button type="button" @click="confirm()" class="btn btn-danger" x-text="confirmLabel"></button>
        </div>
    </form>
</dialog>
{{end}}
