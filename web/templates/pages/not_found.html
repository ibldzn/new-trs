{{define "content"}}
<main class="grid min-h-screen place-items-center px-4 py-16">
    <section class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-xl dark:border-slate-800 dark:bg-slate-900">
        <p class="text-sm font-semibold uppercase tracking-widest text-emerald-600 dark:text-emerald-400">404</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight">{{.Data.Heading}}</h1>
        <p class="mt-3 text-slate-600 dark:text-slate-300">{{.Data.Message}}</p>
        <div class="mt-7 flex flex-wrap justify-center gap-3"><a href="/" class="rounded-lg bg-emerald-500 px-4 py-2.5 font-semibold text-slate-950 hover:bg-emerald-400">Back to application</a><a href="/login" class="rounded-lg border border-slate-300 px-4 py-2.5 font-semibold hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800">Sign in</a></div>
    </section>
</main>
{{end}}
