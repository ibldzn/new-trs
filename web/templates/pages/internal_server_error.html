{{define "content"}}
<main class="grid min-h-screen place-items-center px-4 py-16">
    <section class="w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-xl dark:border-slate-800 dark:bg-slate-900">
        <p class="text-sm font-semibold uppercase tracking-widest text-red-600 dark:text-red-400">500</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight">{{.Data.Heading}}</h1>
        <p class="mt-3 text-slate-600 dark:text-slate-300">{{.Data.Message}}</p>
        {{if .Data.RequestID}}<p class="mt-5 font-mono text-xs text-slate-500">Request ID: {{.Data.RequestID}}</p>{{end}}
        <a href="/" class="mt-7 inline-block rounded-lg bg-emerald-500 px-4 py-2.5 font-semibold text-slate-950 hover:bg-emerald-400">Back to application</a>
    </section>
</main>
{{end}}
