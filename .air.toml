root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/app ./cmd/app"
entrypoint = ["./tmp/app"]
include_ext = ["go"]
exclude_dir = ["bin", "node_modules", "tmp", "web/static"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
